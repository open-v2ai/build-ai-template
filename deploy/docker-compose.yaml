services:
  # API service
  api:
    container_name: bait-api
    image: v2ai/bait-api:latest
    restart: always
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://postgres:123456@postgres:5432/build-ai-template}
      REDIS_URL: ${REDIS_URL:-redis://default:123456@redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-C1H2A3G4E5N6T7}
      MAIL_USERNAME: ${MAIL_USERNAME:-no-reply@tsing.ac.cn}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-Qwer1234.}
      MAIL_FROM: ${MAIL_FROM:-no-reply@tsing.ac.cn}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.qiye.aliyun.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-proj-1234567890}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8000/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bait-network

  web:
    container_name: bait-web
    image: v2ai/bait-web:latest
    restart: always
    environment:
      HOSTNAME: ${HOSTNAME:-0.0.0.0}
      PORT: ${PORT:-3000}
    networks:
      - bait-network

  nginx:
    container_name: bait-nginx
    image: nginx:1.27.5-alpine3.21
    restart: always
    environment:
      NGINX_PORT: ${NGINX_PORT:-8080}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
    ports:
      - ${NGINX_PORT:-8080}:80
    volumes:
      - $PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      api:
        condition: service_healthy
    networks:
      - bait-network

  postgres:
    container_name: bait-postgres
    image: postgres:17.4-bookworm
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-build-ai-template}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
    ports:
      - ${POSTGRES_EXPOSE_PORT:-25432}:5432
    volumes:
      - $PWD/volumes/db/data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD', 'pg_isready', '-h', 'postgres', '-U', '${POSTGRES_USER:-postgres}', '-d', '${POSTGRES_DB:-build-ai-template}' ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bait-network

  # The redis cache.
  redis:
    container_name: bait-redis
    image: redis:7.2.4-alpine
    restart: always
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-123456}
    ports:
      - ${REDIS_EXPOSE_PORT:-26379}:6379
    volumes:
      - $PWD/volumes/redis/data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456} --save 60 1 --loglevel warning
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
    networks:
      - bait-network

networks:
  bait-network:
    driver: bridge
