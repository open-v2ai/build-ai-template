server {
    listen 80;
    server_name localhost; 

    location / {
        proxy_pass http://web:3000;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;

        proxy_buffering off;
        proxy_cache off;
    }

    location /admin {
        proxy_pass http://admin-web:3001;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;

        proxy_buffering off;
        proxy_cache off;
    }

    location /zh/admin {
        proxy_pass http://admin-web:3001/zh/admin;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;

        proxy_buffering off;
        proxy_cache off;
    }

    location /en/admin {
        proxy_pass http://admin-web:3001/en/admin;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;

        proxy_buffering off;
        proxy_cache off;
    }

    location /api/v1/ {
        proxy_pass http://api:8000/api/v1/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;

        proxy_buffering off;
        proxy_cache off;
    }
}