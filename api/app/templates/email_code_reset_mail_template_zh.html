<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: 'Arial', sans-serif;
        line-height: 16pt;
        color: #101828;
        background-color: #e9ebf0;
        margin: 0;
        padding: 0;
      }
      .container {
        width: 600px;
        height: 360px;
        margin: 40px auto;
        padding: 36px 48px;
        background-color: #fcfcfd;
        border-radius: 16px;
        border: 1px solid #ffffff;
        box-shadow: 0 2px 4px -2px rgba(9, 9, 11, 0.08);
      }
      .header {
        margin-bottom: 24px;
      }
      .header img {
        max-width: 100px;
        height: auto;
      }
      .title {
        font-weight: 600;
        font-size: 24px;
        line-height: 28.8px;
      }
      .description {
        font-size: 13px;
        line-height: 16px;
        color: #676f83;
        margin-top: 12px;
      }
      .code-content {
        padding: 16px 32px;
        text-align: center;
        border-radius: 16px;
        background-color: #f2f4f7;
        margin: 16px auto;
      }
      .code {
        line-height: 36px;
        font-weight: 700;
        font-size: 30px;
      }
      .tips {
        line-height: 16px;
        color: #676f83;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="https://raw.githubusercontent.com/open-v2ai/build-ai-template/refs/heads/main/web/public/logo.svg" alt="Build AI Template Logo" />
      </div>
      <p class="title">Build AI Template 密码重置验证码</p>
      <p class="description">您正在重置 Build AI Template 的密码。请复制并粘贴此验证码完成密码重置，验证码仅在接下来的 5 分钟内有效。</p>
      <div class="code-content">
        <span class="code">{{code}}</span>
      </div>
      <p class="tips">如果您没有请求密码重置，请立即更改您的密码以确保账户安全。</p>
    </div>
  </body>
</html>
